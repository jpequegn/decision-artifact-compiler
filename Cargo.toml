[workspace]
members = [
  "crates/artifact-cli",
  "crates/artifact-core",
  "crates/artifact-runtime",
  "crates/artifact-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jpequegn/decision-artifact-compiler"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
